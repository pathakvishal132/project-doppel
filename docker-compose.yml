# Local infrastructure for Project Doppel: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doppel
      POSTGRES_USER: doppel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doppel}
    ports:
      - "5432:5432"
    volumes:
      - doppel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doppel -d doppel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  doppel-pg:
