spring:
  cache:
    # brand-list cache stays in process (ConcurrentMapCacheManager); Redis is used only via ScreeningCache
    type: simple
  application:
    name: project-doppel
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doppel}
    username: ${DB_USERNAME:doppel}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

doppel:
  # redis = Redis-backed screening cache; memory = in-process (unit tests only)
  store: ${DOPPEL_STORE:redis}
  screening-cache-ttl: 24h
  # Secret key for HMAC-SHA256 of the registrant account. MUST be overridden in every real environment.
  hmac-secret: ${DOPPEL_HMAC_SECRET:local-dev-only-secret-change-me}
  scores:
    brand-exact: 50
    homoglyph: 60
    typosquat: 40
    lure-keyword: 20
  thresholds:
    block: 70
    review: 40
  # assignment defaults
  lure-keywords:
    - support
    - care
    - refund
    - kyc
    - cashback
    - helpline
    - reward
    - verify
    - offer
