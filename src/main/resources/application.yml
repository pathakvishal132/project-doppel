spring:
  application:
    name: project-doppel
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doppel}
    username: ${DB_USERNAME:doppel}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

doppel:
  # Secret key for HMAC-SHA256 of the registrant account. MUST be overridden in every real environment.
  hmac-secret: ${DOPPEL_HMAC_SECRET:local-dev-only-secret-change-me}
  scores:
    brand-exact: 50
    homoglyph: 60
    typosquat: 40
    lure-keyword: 20
  thresholds:
    block: 70
    review: 40
  lure-keywords:
    - refund
    - refunds
    - support
    - helpdesk
    - help
    - care
    - customercare
    - kyc
    - verify
    - verification
    - reward
    - rewards
    - cashback
    - offer
    - bonus
    - claim
    - prize
    - lottery
    - official
    - service
    - billpay
    - update
