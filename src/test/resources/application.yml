spring:
  cache:
    type: simple
  datasource:
    url: jdbc:h2:mem:doppel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

doppel:
  store: memory
  screening-cache-ttl: 24h
  hmac-secret: test-secret
  scores:
    brand-exact: 50
    homoglyph: 60
    typosquat: 40
    lure-keyword: 20
  thresholds:
    block: 70
    review: 40
  lure-keywords: [support, care, refund, kyc, cashback, helpline, reward, verify, offer]
